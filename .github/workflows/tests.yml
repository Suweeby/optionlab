name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the package with app and dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[app,dev]"

      - name: Lint
        run: ruff check .

      - name: Tests (no network needed)
        run: python -m pytest -q

      - name: Quick audit (fails the build on any FAIL)
        run: python scripts/run_audit.py --quick

      - name: Keep the audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-report
          path: docs/audit/
