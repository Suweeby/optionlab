[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "optionlab"
version = "0.1.0"
description = "Options pricer and stock simulator"
requires-python = ">=3.11"
dependencies = ["numpy", "scipy", "pandas"]

[project.optional-dependencies]
app = ["streamlit", "plotly", "yfinance"]       # the Streamlit app and live market data
dev = ["pytest", "ruff", "hypothesis"]          # tests and lint (used by CI)
results = ["plotly", "kaleido"]                 # scripts/generate_results.py (PNG figures)

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
exclude = [".venv", "docs"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "E402", "E731"]